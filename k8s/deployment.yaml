apiVersion: apps/v1
kind: Deployment
metadata:
  name: medibot
  labels: { app: medibot }
spec:
  replicas: 2
  selector:
    matchLabels: { app: medibot }
  template:
    metadata:
      labels: { app: medibot }
    spec:
      containers:
        - name: medibot
          image: medibot:latest
          imagePullPolicy: IfNotPresent   # use the locally built image (minikube / kind)
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: medibot-config }
            - secretRef:    { name: medibot-secret }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
